name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22.22.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Show runner Node
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run sync:data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
